name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a run in progress finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish only the website. `design/` holds the Claude Design handoff
      # (brand doc, chats, uploads) and is deliberately left unpublished.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html 404.html assets contact intake insights robots.txt sitemap.xml _site/
          touch _site/.nojekyll

          # Stamp the stylesheet and script URLs with this commit, so a new
          # deploy is never served from a stale browser or CDN cache.
          find _site -name "*.html" -print0 | xargs -0 sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g"
          [ -f CNAME ] && cp CNAME _site/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
