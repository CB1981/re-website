<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Re.</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B2E27">
<link rel="icon" href="assets/img/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  body { background: var(--forest); color: var(--ivory); }
  .lost {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 26px;
    max-width: 640px;
  }
  .lost h1 { font-size: clamp(38px, 7vw, 72px); line-height: 1; letter-spacing: -0.03em; }
  .lost p { font-size: 18px; line-height: 1.6; color: var(--stone); }
</style>
</head>
<body>
  <main class="shell lost">
    <span class="wordmark" style="color: var(--ivory)"><span>Re</span><span class="wordmark__dot" aria-hidden="true"></span></span>
    <p class="kicker kicker--dark">Error 404</p>
    <h1 class="display">This page doesn't exist. Yet.</h1>
    <p>The link may be out of date, or we moved something. Start again from the top.</p>
    <a class="btn-underline btn-underline--onDark" href="/" style="align-self: flex-start">Back to Re.</a>
  </main>
</body>
</html>
